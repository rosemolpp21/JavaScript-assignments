<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment 4</title>
    <link rel="stylesheet" href="css/style.css">

</head>
<body>
    <div id="main-container">
        <p id="details" style="display: none;">Name - kkpp <br>Age: 15 <br>place: placename<br></p>
    </div>
    <div class="align-button">
    <button id="hide-button">Hide div</button>
    <button id="color-button">Change background color</button>
    <button id="show-details-button">Show/hide details</button>
    </div>
    <div id="selection-box-msg-container">

    </div>
    <div class="select-box">
        <select name="selection" id="first-select-box">
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4</option>
            <option value="5">5</option>
            <option value="6">6</option>
            <option value="7">7</option>
            <option value="8">8</option>
            <option value="9">9</option>
            <option value="10">10</option>
        </select>
    </div> 
    <div id="show-language"></div>   
    <div id="button-container"></div>
    <div id="form-container">
    <form id="form-details">
        <label for="name">Name</label>
        <input type="text" id="name"><br>
        <p id="name-error"></p>
        <label for="phoneno">phone number</label>
        <input type="text" id="phoneno"><br>
        <p id="phoneno-error"></p>
        <label for="place">Place</label>
        <input type="text" id="place"><br>
        <p id="place-error"></p>
        <label for="companyname">Company name</label>
        <input type="text" id="companyname"><br>
        <p id="companyname-error"></p>
        <label for="pincode">Pin code</label>
        <input type="text" id="pincode"><br>
        <p id="pincode-error"></p>
        <button type="submit" id="form-submit">Submit</button>
        <button id="prepopulate">Prepopulate</button>
    </form>
   </div>
    <div class="tab-title-change">
        <form action="" id="tab-title-changing-form">
              <label for="tab-title">New tab title</label>
              <input type="text" id="tab-title">
              <p id="title-error"></p>
              <button type="submit" id="tab-title-submission">submit</button>
        </form>
    </div>
    <script src="assignment4.js"> 
    </script>
